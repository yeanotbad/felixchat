<html>

<head>

<title>Felix Chat</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
font-family:Arial,sans-serif;
background:#080b16;
color:white;
}

.app{
height:100%;
display:flex;
}

.sidebar{
width:300px;
background:#0d1220;
border-right:1px solid #293650;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.logo{
font-size:25px;
font-weight:900;
margin-bottom:5px;
}

.profile{
display:flex;
align-items:center;
gap:10px;
padding:10px;
border-radius:14px;
background:#151c30;
}

.avatar{
width:42px;
height:42px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
background:linear-gradient(
135deg,
#7658ff,
#19d9ff
);
}

.small{
font-size:12px;
color:#8f9db7;
}

.online{
color:#49e79a;
}

button{
border:0;
cursor:pointer;
}

.btn{
width:100%;
padding:12px;
border-radius:12px;
background:#151e33;
border:1px solid #2c3854;
color:white;
font-weight:bold;
}

.primary{
background:linear-gradient(
135deg,
#7257ff,
#278cff
);
}

.request-button{
position:relative;
}

.badge{
position:absolute;
right:8px;
top:7px;
background:#ff496c;
border-radius:20px;
padding:2px 7px;
font-size:11px;
}

.friends{
overflow:auto;
}

.friend{
display:flex;
align-items:center;
gap:10px;
padding:10px;
border-radius:13px;
cursor:pointer;
}

.friend:hover,
.friend.active{
background:#1b2742;
}

.chat{
flex:1;
display:flex;
flex-direction:column;
min-width:0;
}

.chat-header{
height:70px;
padding:10px 18px;
display:flex;
align-items:center;
border-bottom:1px solid #293650;
}

.messages{
flex:1;
overflow:auto;
padding:18px;
display:flex;
flex-direction:column;
gap:10px;
}

.empty{
margin:auto;
text-align:center;
color:#8795ae;
}

.message{
max-width:75%;
padding:11px 14px;
border-radius:18px;
background:#151e32;
}

.message.mine{
align-self:flex-end;
background:linear-gradient(
135deg,
#7055ff,
#287eff
);
}

.composer{
display:flex;
gap:8px;
padding:10px;
border-top:1px solid #293650;
}

.message-input{
flex:1;
padding:13px;
border-radius:13px;
border:1px solid #2c3854;
background:#11192c;
color:white;
outline:none;
}

.send{
padding:0 18px;
border-radius:13px;
background:#7257ff;
color:white;
font-weight:bold;
}

.modal{
position:fixed;
inset:0;
background:#000b;
display:none;
align-items:center;
justify-content:center;
padding:18px;
}

.modal-box{
width:min(500px,100%);
background:#10182a;
border:1px solid #30405f;
border-radius:22px;
padding:22px;
}

.input{
width:100%;
padding:12px;
border-radius:12px;
border:1px solid #2c3854;
background:#11192c;
color:white;
}

.row{
display:flex;
gap:8px;
margin-top:10px;
}

.row>*{
flex:1;
}

.request{
display:flex;
align-items:center;
gap:10px;
padding:12px;
background:#151e32;
border-radius:13px;
margin:8px 0;
}


.message-tools{display:flex;justify-content:flex-end;margin-top:5px;opacity:0;transition:.15s}
.message:hover .message-tools{opacity:1}
.message-tools button{background:transparent;color:#b9c5df;border:0;font-size:12px;cursor:pointer}
.message-media{max-width:min(420px,75vw);max-height:360px;border-radius:14px;display:block}
.message-video{max-width:min(480px,75vw);max-height:360px;border-radius:14px;display:block}
.message-audio{width:min(360px,70vw)}
.composer-extra{display:flex;gap:6px}
.icon-btn{padding:0 12px;border-radius:13px;background:#151e33;border:1px solid #2c3854;color:#fff;font-weight:700}
.icon-btn.recording{background:#c83d5c}
#fileInput{display:none}
@media(max-width:700px){

.sidebar{
width:76px;
padding:9px;
}

.logo{
font-size:0;
}

.logo:first-letter{
font-size:25px;
}

.profile{
justify-content:center;
}

.profile-info{
display:none;
}

.friend{
justify-content:center;
}

.friend-info{
display:none;
}

.sidebar .btn{
font-size:0;
}

.sidebar .primary{
font-size:20px;
}

.chat-header{
height:64px;
}

.message{
max-width:90%;
}

}

/* Mobile-first chat navigation: desktop layout remains unchanged. */
.mobile-back{display:none}
@media(max-width:700px){
  html,body{width:100%;height:100%;overflow:hidden}
  .app{height:100dvh;width:100%;display:block;position:relative}
  .sidebar{width:100%;height:100dvh;border:0;padding:12px 12px 86px;overflow:auto}
  .chat{display:none;height:100dvh;width:100%;min-width:0}
  body.mobile-chat-open .sidebar{display:none}
  body.mobile-chat-open .chat{display:flex}
  body.mobile-chat-open .mobile-back{display:block;position:absolute;left:10px;top:14px;z-index:20;width:42px;height:42px;border-radius:14px;background:#151e33;border:1px solid #2c3854;color:#fff;font-size:30px;line-height:30px}
  body.mobile-chat-open .chat-header{padding-left:62px;height:68px;flex-shrink:0}
  .chat-header .profile{background:transparent;padding:0}
  .story-strip{padding:10px 12px;flex-shrink:0}
  .messages{padding:12px;gap:8px;min-height:0}
  .composer{padding:8px;gap:6px;flex-wrap:nowrap;flex-shrink:0;padding-bottom:max(8px,env(safe-area-inset-bottom))}
  .composer-extra{gap:4px}
  .icon-btn{padding:0 9px;min-width:42px;height:42px}
  .message-input{min-width:0;height:42px;font-size:16px}
  .send{height:42px;padding:0 13px}
  .snap-toolbar{grid-template-columns:1fr 1fr;gap:8px}
  .snap-toolbar .btn,.sidebar>.btn{min-height:44px}
  .profile{min-height:54px}
  .friend{min-height:58px;padding:9px 10px}
  .friends{max-height:none;overflow:auto}
  .notification-bell{min-height:46px}
  .modal-box{max-height:90dvh;overflow:auto;border-radius:20px;padding:18px}
  .row{flex-wrap:wrap}
  .row>*{min-width:120px}
  .message{max-width:88%;font-size:15px}
  .message-media,.message-video{max-width:78vw;max-height:45vh}
}
</style>

/* Natural responsive mobile layout — no phone frame */
@media (max-width: 700px) {
  html, body {
    width: 100%;
    height: 100%;
    min-height: 100%;
    overflow: hidden;
    margin: 0;
  }

  .app {
    width: 100%;
    height: 100dvh;
    min-height: 100%;
    display: block;
    overflow: hidden;
  }

  /* Chat list */
  .sidebar {
    width: 100%;
    height: 100dvh;
    min-height: 0;
    padding: max(10px, env(safe-area-inset-top))
             10px
             max(78px, env(safe-area-inset-bottom))
             10px;
    border: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }

  .logo {
    font-size: 22px;
    margin: 2px 2px 6px;
  }

  .profile {
    width: 100%;
    justify-content: flex-start;
    min-height: 58px;
  }

  .profile-info,
  .friend-info {
    display: block;
  }

  .sidebar .btn {
    font-size: 14px;
    min-height: 46px;
  }

  .sidebar .primary {
    font-size: 15px;
  }

  .snap-toolbar {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .snap-toolbar .btn {
    min-height: 46px;
    padding: 10px 7px;
    white-space: normal;
  }

  .snap-search {
    width: 100%;
  }

  .snap-search .input {
    min-width: 0;
  }

  .friends {
    width: 100%;
    overflow: visible;
  }

  .friend {
    width: 100%;
    min-height: 62px;
    padding: 10px;
  }

  .notification-bell,
  .request-button {
    width: 100%;
  }

  /* Conversation */
  .chat {
    display: none;
    width: 100%;
    height: 100dvh;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
  }

  body.mobile-chat-open .sidebar {
    display: none;
  }

  body.mobile-chat-open .chat {
    display: flex;
  }

  .mobile-back {
    display: none;
  }

  body.mobile-chat-open .mobile-back {
    display: flex;
    position: absolute;
    left: 8px;
    top: max(8px, env(safe-area-inset-top));
    z-index: 20;
    width: 42px;
    height: 42px;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: #151e33;
    border: 1px solid #2c3854;
    color: #fff;
    font-size: 28px;
    line-height: 1;
  }

  body.mobile-chat-open .chat-header {
    height: 64px;
    min-height: 64px;
    flex-shrink: 0;
    padding: 8px 10px 8px 58px;
  }

  .chat-header .profile {
    background: transparent;
    padding: 0;
  }

  .story-strip {
    width: 100%;
    flex-shrink: 0;
    padding: 9px 10px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .messages {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    padding: 12px 10px;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
  }

  .message {
    max-width: 88%;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .message-media,
  .message-video {
    max-width: min(78vw, 360px);
    height: auto;
  }

  .message-audio {
    max-width: 78vw;
  }

  /* Keep every composer control reachable instead of cropping it */
  .composer {
    flex: 0 0 auto;
    width: 100%;
    padding: 7px 7px max(7px, env(safe-area-inset-bottom));
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }

  .message-input {
    order: 1;
    flex: 1 1 calc(100% - 58px);
    width: 0;
    min-width: 0;
    height: 44px;
    font-size: 16px;
  }

  .send {
    order: 2;
    flex: 0 0 auto;
    height: 44px;
    padding: 0 14px;
  }

  .composer-extra {
    order: 3;
    width: 100%;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-top: 2px;
    -webkit-overflow-scrolling: touch;
  }

  .icon-btn {
    flex: 0 0 44px;
    width: 44px;
    height: 40px;
    padding: 0;
  }

  /* Modals and admin screens fit small phones without hiding controls */
  .modal {
    padding: 10px;
    align-items: flex-end;
  }

  .modal-box {
    width: 100%;
    max-width: 100%;
    max-height: calc(100dvh - 20px);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    border-radius: 20px 20px 12px 12px;
    padding: 16px;
  }

  .row {
    flex-wrap: wrap;
  }

  .row > * {
    min-width: 0;
  }

  .request {
    flex-wrap: wrap;
  }

  .request .btn {
    width: auto;
    min-width: 90px;
  }

  .story-viewer {
    padding: 8px;
  }

  .story-viewer-box {
    width: 100%;
    height: calc(100dvh - 16px);
    max-width: 100%;
    border-radius: 18px;
  }

  .video-save-menu {
    max-width: calc(100vw - 32px);
  }
}


/* Felix Chat clean UI polish */
:root{
  --bg:#080b16;
  --panel:#0e1422;
  --panel2:#131b2d;
  --panel3:#18223a;
  --border:#25324b;
  --text:#f5f7ff;
  --muted:#8e9bb4;
  --accent:#6f59ff;
  --accent2:#3188ff;
}

body{
  background:radial-gradient(circle at 50% -10%,#141d36 0,#080b16 48%);
  color:var(--text);
  letter-spacing:.05px;
}

.sidebar{
  background:rgba(12,17,30,.96);
  border-right:1px solid rgba(70,88,125,.35);
  padding:14px;
  gap:8px;
}

.logo{
  font-size:22px;
  letter-spacing:-.4px;
  padding:2px 3px 5px;
}

.profile{
  background:rgba(21,29,48,.82);
  border:1px solid rgba(66,82,115,.35);
  padding:8px;
  border-radius:13px;
}

.avatar{
  width:40px;
  height:40px;
  flex:0 0 40px;
}

.btn{
  min-height:40px;
  padding:9px 11px;
  border-radius:10px;
  background:rgba(21,30,51,.82);
  border:1px solid rgba(66,82,115,.55);
  font-size:13px;
  transition:transform .12s ease,background .12s ease,border-color .12s ease,box-shadow .12s ease;
}

.btn:hover{
  background:#1a2741;
  border-color:#3a4b70;
  transform:translateY(-1px);
}

.btn:active{
  transform:translateY(0);
}

.primary{
  background:linear-gradient(135deg,#715aff,#3488ff);
  border-color:transparent;
  box-shadow:0 5px 16px rgba(75,91,255,.18);
}

.primary:hover{
  background:linear-gradient(135deg,#7b65ff,#3c91ff);
}

.friend{
  padding:8px 9px;
  border-radius:11px;
  min-height:54px;
}

.friend:hover,.friend.active{
  background:#18243d;
}

.chat{
  background:#090e19;
}

.chat-header{
  height:64px;
  padding:8px 15px;
  background:rgba(9,14,25,.82);
  border-bottom:1px solid rgba(70,88,125,.35);
  backdrop-filter:blur(10px);
}

.messages{
  padding:15px;
  gap:8px;
}

.message{
  max-width:72%;
  padding:9px 12px;
  border-radius:15px;
  background:#151e31;
  border:1px solid rgba(66,82,115,.25);
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.message.mine{
  background:linear-gradient(135deg,#6652e9,#327ce4);
  border-color:transparent;
}

.composer{
  padding:8px;
  background:rgba(10,15,26,.95);
  border-top:1px solid rgba(70,88,125,.35);
}

.message-input{
  padding:10px 12px;
  border-radius:11px;
  background:#11192a;
  border-color:#293752;
  min-height:40px;
}

.send{
  min-height:40px;
  padding:0 14px;
  border-radius:11px;
}

.icon-btn{
  min-height:40px;
  height:40px;
  padding:0 10px;
  border-radius:10px;
}

.snap-toolbar{
  gap:6px!important;
}

.snap-toolbar .btn{
  padding:8px 7px!important;
}

.input{
  padding:10px 11px;
  border-radius:10px;
}

.snap-search{
  gap:5px;
}

.story-strip{
  padding:8px 14px;
  background:rgba(9,14,25,.65);
}

.story-ring{
  width:54px;
  height:54px;
}

.modal{
  background:rgba(0,0,0,.68);
  backdrop-filter:blur(4px);
}

.modal-box{
  background:#101829;
  border:1px solid #2a3955;
  border-radius:17px;
  padding:18px;
  box-shadow:0 18px 55px rgba(0,0,0,.42);
}

.request{
  padding:9px;
  border-radius:11px;
  background:#151e31;
  border:1px solid rgba(66,82,115,.25);
}

.badge,.notification-badge{
  font-weight:700;
}

.small{
  font-size:11px;
}

@media(max-width:700px){
  .sidebar{
    padding:10px 10px max(72px,env(safe-area-inset-bottom));
    gap:7px;
  }

  .logo{font-size:20px}

:root{
  --bg:#080914;
  --bg2:#0d1020;
  --panel:#111528;
  --panel2:#171c35;
  --panel3:#1d2443;
  --line:#2a3152;
  --text:#f7f7ff;
  --muted:#949bb8;
  --accent:#8b5cf6;
  --accent2:#ec4899;
  --accent3:#38bdf8;
  --good:#34d399;
  --danger:#fb7185;
  --shadow:0 14px 40px rgba(0,0,0,.28);
}

*{box-sizing:border-box}

html{background:var(--bg)}

body{
  background:
    radial-gradient(900px 500px at 15% -10%,rgba(139,92,246,.16),transparent 60%),
    radial-gradient(700px 450px at 100% 100%,rgba(56,189,248,.09),transparent 60%),
    linear-gradient(135deg,var(--bg),var(--bg2));
  color:var(--text);
  transition:background .35s ease,color .25s ease;
}

/* Panels */
.sidebar{
  background:rgba(12,15,29,.92);
  border-right:1px solid rgba(139,92,246,.20);
  box-shadow:10px 0 35px rgba(0,0,0,.12);

}

.chat{
  background:rgba(8,9,20,.82);
}

.chat-header{
  background:rgba(10,12,24,.78);
  border-bottom:1px solid rgba(139,92,246,.16);
  backdrop-filter:blur(18px);
}

.composer{
  background:rgba(10,12,24,.9);
  border-top:1px solid rgba(139,92,246,.16);
  backdrop-filter:blur(16px);
}

.profile{
  background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(56,189,248,.05));
  border:1px solid rgba(139,92,246,.20);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}

.profile:hover{
  transform:translateY(-1px);
  border-color:rgba(139,92,246,.38);
  box-shadow:0 8px 25px rgba(139,92,246,.08);
}

.avatar{
  background:linear-gradient(135deg,var(--accent),var(--accent2) 55%,var(--accent3));
  box-shadow:0 4px 16px rgba(139,92,246,.22);
}

/* Buttons */
button,.btn,.icon-btn,.send,.friend,.story-card,.request,.notification-item{
  -webkit-tap-highlight-color:transparent;
}

.btn{
  background:linear-gradient(135deg,rgba(25,30,55,.95),rgba(18,23,42,.95));
  border:1px solid rgba(91,103,145,.35);
  color:var(--text);
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  transition:
    transform .16s cubic-bezier(.2,.8,.2,1),
    box-shadow .16s ease,
    background .2s ease,
    border-color .2s ease,
    filter .16s ease;
}

.btn:hover{
  background:linear-gradient(135deg,rgba(38,43,75,.98),rgba(25,30,55,.98));
  border-color:rgba(139,92,246,.45);
  box-shadow:0 7px 22px rgba(0,0,0,.18),0 0 18px rgba(139,92,246,.06);
  transform:translateY(-2px);
}

.btn:active,.icon-btn:active,.send:active{
  transform:scale(.94);
  filter:brightness(1.12);
  transition-duration:.06s;
}

.primary{
  background:linear-gradient(135deg,#8b5cf6,#ec4899);
  border-color:transparent;
  box-shadow:0 6px 20px rgba(139,92,246,.25);
}

.primary:hover{
  background:linear-gradient(135deg,#9b70ff,#f05ca6);
  box-shadow:0 9px 28px rgba(139,92,246,.35);
}

/* Links/list items */
.friend,.request,.notification-item{
  transition:background .18s ease,transform .16s ease,border-color .18s ease,box-shadow .18s ease;
}

.friend:hover{
  background:linear-gradient(90deg,rgba(139,92,246,.13),rgba(56,189,248,.04));
  transform:translateX(2px);
}

.friend.active{
  background:linear-gradient(90deg,rgba(139,92,246,.20),rgba(56,189,248,.06));
  border-left:2px solid var(--accent);
}

/* Inputs */
.input,.message-input{
  background:rgba(12,17,32,.92);
  border:1px solid rgba(80,93,132,.42);
  color:var(--text);
  transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
}

.input:focus,.message-input:focus{
  border-color:rgba(139,92,246,.72);
  background:#10152a;
  box-shadow:0 0 0 3px rgba(139,92,246,.11),0 4px 18px rgba(0,0,0,.12);
  outline:none;
}

  background:linear-gradient(135deg,#8b5cf6,#ec4899);
  border:0;
  color:white;
  box-shadow:0 5px 17px rgba(139,92,246,.22);
  transition:transform .12s ease,filter .15s ease,box-shadow .15s ease;
}

.send:hover{
  filter:brightness(1.08);
  box-shadow:0 8px 24px rgba(139,92,246,.32);
}

.icon-btn{
  background:rgba(24,30,54,.95);
  border:1px solid rgba(91,103,145,.38);
  color:#e9eaff;

}

.icon-btn:hover{
  background:rgba(42,49,82,.98);
  border-color:rgba(139,92,246,.45);
  transform:translateY(-1px);
}

.message{
  animation:messageIn .24s cubic-bezier(.2,.8,.2,1);
  border-color:rgba(91,103,145,.20);
}

.message.mine{
  background:linear-gradient(135deg,#7654e9,#c34ca8);
  box-shadow:0 5px 16px rgba(139,92,246,.12);
}

@keyframes messageIn{
  from{opacity:0;transform:translateY(7px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* Stories */
.story-card{
  transition:transform .18s ease,filter .18s ease;
}
.story-card:hover{transform:translateY(-2px)}
.story-card:active{transform:scale(.94)}
.story-ring{
  background:linear-gradient(135deg,#f59e0b,#ec4899,#8b5cf6,#38bdf8);
  box-shadow:0 5px 18px rgba(139,92,246,.12);
}

/* Badges */
.badge,.notification-badge{
  background:linear-gradient(135deg,#ec4899,#fb7185);
  box-shadow:0 3px 10px rgba(236,72,153,.25);
}

/* Modals */
.modal{
  background:rgba(3,4,10,.72);
  backdrop-filter:blur(8px);
  animation:fadeIn .16s ease;
}

.modal-box{
  background:linear-gradient(145deg,#13182d,#0f1425);
  border:1px solid rgba(139,92,246,.24);
  box-shadow:0 25px 80px rgba(0,0,0,.48),0 0 35px rgba(139,92,246,.06);
  animation:modalIn .22s cubic-bezier(.2,.8,.2,1);
}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{
  from{opacity:0;transform:translateY(10px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

/* Notification toast */
.toast-notification{
  background:linear-gradient(135deg,#171c35,#11162a);
  border:1px solid rgba(139,92,246,.35);
  box-shadow:0 15px 45px rgba(0,0,0,.38),0 0 25px rgba(139,92,246,.08);
  animation:toastIn .3s cubic-bezier(.2,.8,.2,1);
}
@keyframes toastIn{
  from{opacity:0;transform:translateY(-10px) translateX(8px)}
  to{opacity:1;transform:translateY(0) translateX(0)}
}

/* Loading/focus polish */
button:focus-visible,input:focus-visible{
  outline:2px solid rgba(139,92,246,.7);
  outline-offset:2px;
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;
    transition-duration:.001ms!important;
    scroll-behavior:auto!important;
  }
}

<script>

const API =
location.origin + "/api";

let token =
localStorage.getItem("felix_token");

let me = null;

let activeFriend = null;

let socket = null;


function $(id){
return document.getElementById(id);
}


function initials(name){

return (name || "?")
.slice(0,2)
.toUpperCase();

}


function openModal(html){

$("modalBox").innerHTML =
html;

$("modal").style.display =
"flex";

}


function closeModal(){

$("modal").style.display =
"none";

}


async function api(url,options={}){

options.headers = {

"Content-Type":
"application/json",

...(options.headers || {})

};

if(token){

options.headers.Authorization =
"Bearer " + token;

}

const response =
await fetch(API + url,options);

const data =
await response.json()
.catch(()=>({}));

if(!response.ok){

throw new Error(
data.error ||
"Something went wrong"
);

}

return data;

}


/* LOGIN */

function loginScreen(){

openModal(`

<h2>💬 Felix Chat</h2>

<p>Create an account or log in.</p>

<input
id="username"
class="input"
placeholder="Username"
/>

<br><br>

<input
id="password"
class="input"
type="password"
placeholder="Password"
/>

<div class="row">

<button
class="btn primary"
onclick="register()"
>
Create Account
</button>

<button
class="btn"
onclick="login()"
>
Log In
</button>

</div>

`);

}


async function register(){

try{

const data =
await api(
"/register",
{
method:"POST",
body:JSON.stringify({

username:
$("username").value,

password:
$("password").value

})
}
);

token =
data.token;

localStorage.setItem(
"felix_token",
token
);

closeModal();

loadUser();

}

catch(error){

alert(error.message);

}

}


async function login(){

try{

const data =
await api(
"/login",
{
method:"POST",
body:JSON.stringify({

username:
$("username").value,

password:
$("password").value

})
}
);

token =
data.token;

localStorage.setItem(
"felix_token",
token
);

closeModal();

loadUser();

}

catch(error){

alert(error.message);

}

}


/* LOAD USER */

async function loadUser(){

try{

me =
await api("/me");

$("myName").textContent =
"@" + me.username;

$("myAvatar").textContent =
initials(me.username);

renderFriends();

connectSocket();

}

catch{

localStorage.removeItem(
"felix_token"
);

token = null;

loginScreen();

}

}


/* FRIEND LIST */

function renderFriends(){

const container =
$("friends");

container.innerHTML = "";

me.friends.forEach(friend => {

const element =
document.createElement("div");

element.className =
"friend";

if(
activeFriend &&
activeFriend.uid === friend.uid
){

element.classList.add(
"active"
);

}

element.innerHTML = `

<div class="avatar">

${initials(friend.username)}

</div>

<div class="friend-info">

<b>
@${friend.username}
</b>

<div class="small">

${friend.online
? "● Online"
: "○ Offline"}

</div>

</div>

`;

element.onclick =
()=>selectFriend(friend);

container.appendChild(element);

});


const count =
me.requests.length;

$("requestBadge").textContent =
count;

$("requestBadge").style.display =
count
? "block"
: "none";

}


/* FRIEND REQUEST WINDOW */

async function showRequests(){

await loadUser();

let html = `

<h2>
🔔 Friend Requests
</h2>

`;

if(me.requests.length === 0){

html += `

<p>

else{

me.requests.forEach(request => {

html += `

<div class="request">

</div>

<b style="flex:1">

@${request.username}

class="btn primary"

class="btn"
onclick="declineRequest('${request.uid}')"
>
✕
</button>

}

class="btn"

style="margin-top:10px"

openModal(html);

}

/* SELECT FRIEND */

async function selectFriend(friend){

activeFriend =
friend;

$("friendName").textContent =
"@" + friend.username;

$("friendAvatar").textContent =
initials(friend.username);

$("friendStatus").textContent =

? "● Online"
: "○ Offline";

$("messageInput").disabled =
false;

renderFriends();

}


/* MESSAGES — render once, then apply realtime events directly */
function messageBubble(message){
  const bubble=document.createElement("div");
  bubble.className="message"+(message.from===me.uid?" mine":"");
  bubble.dataset.messageId=message.id;

  if(message.kind==="image"){
    const img=document.createElement("img");
    img.className="message-media"; img.src=message.url; img.alt=message.name||"Image"; img.loading="lazy";
    bubble.appendChild(img);
  }else if(message.kind==="video"){
    const mediaWrap=document.createElement("div");
    mediaWrap.className="video-message-wrap";
    const v=document.createElement("video");
    v.className="message-video"; v.controls=true; v.preload="metadata"; v.src=message.url;
    mediaWrap.appendChild(v);
    let pressTimer=null;
    const showSave=()=>{
      document.querySelectorAll(".video-save-menu").forEach(x=>x.remove());
      const menu=document.createElement("div");
      menu.className="video-save-menu";
      const saveBtn=document.createElement("button");
      saveBtn.textContent="💾 Save to camera roll";
      saveBtn.onclick=async()=>{
        menu.remove();
        try{
          const response=await fetch(message.url);
          const blob=await response.blob();
          const blobUrl=URL.createObjectURL(blob);
          const a=document.createElement("a");
          a.href=blobUrl;
          a.download=message.name||("felix-video-"+Date.now()+".mp4");
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(()=>URL.revokeObjectURL(blobUrl),2000);
        }catch(error){
          const a=document.createElement("a"); a.href=message.url; a.download=message.name||"felix-video.mp4"; a.target="_blank"; a.click();
        }
      };
      menu.appendChild(saveBtn); mediaWrap.appendChild(menu);
      setTimeout(()=>menu.remove(),5000);
    };
    const startPress=()=>{pressTimer=setTimeout(showSave,550);};
    const cancelPress=()=>{if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}};
    v.addEventListener("pointerdown",startPress);
    ["pointerup","pointercancel","pointerleave"].forEach(ev=>v.addEventListener(ev,cancelPress));
    v.addEventListener("contextmenu",e=>{e.preventDefault();showSave();});
    bubble.appendChild(mediaWrap);
  }else if(message.kind==="voice"){
    const a=document.createElement("audio");
    a.className="message-audio"; a.controls=true; a.preload="metadata"; a.src=message.url;
    bubble.appendChild(a);
  }else{
    bubble.appendChild(document.createTextNode(message.text||""));
  }

  if(message.from===me.uid){
    const tools=document.createElement("div");
    tools.className="message-tools";
    const del=document.createElement("button");
    del.textContent="Delete";
    del.onclick=()=>deleteMessage(message.id);
    tools.appendChild(del);
    bubble.appendChild(tools);
  }
  return bubble;
}

function appendMessage(message,scroll=true){
  if(!activeFriend || !message) return;
  if($("messages").querySelector(`[data-message-id="${CSS.escape(message.id)}"]`)) return;
  const empty=$("messages").querySelector(".empty");
  if(empty) empty.remove();
  $("messages").appendChild(messageBubble(message));
  if(scroll) $("messages").scrollTop=$("messages").scrollHeight;
}

async function loadMessages(){
  if(!activeFriend) return;
  try{
    const messages=await api("/messages/"+activeFriend.uid);
    const container=$("messages");
    container.innerHTML="";
    if(!messages.length){
      container.innerHTML='<div class="empty">No messages yet.<br>Say hello! 👋</div>';
      return;
    }
    const fragment=document.createDocumentFragment();
    messages.forEach(message=>fragment.appendChild(messageBubble(message)));
    container.appendChild(fragment);
    container.scrollTop=container.scrollHeight;
  }catch(error){ console.log(error); }
}

function removeMessage(messageId){
  const node=$("messages").querySelector(`[data-message-id="${CSS.escape(messageId)}"]`);
  if(node) node.remove();
  if(!$("messages").querySelector(".message")){
    $("messages").innerHTML='<div class="empty">No messages yet.<br>Say hello! 👋</div>';
  }
}

async function deleteMessage(messageId){
  if(!activeFriend || !confirm("Delete this message?")) return;
  try{
    await api("/messages/"+activeFriend.uid+"/"+messageId,{method:"DELETE"});
    // Server broadcasts the deletion to both sides. Removing here too makes
    // the local UI feel instant even before the WebSocket event arrives.
    removeMessage(messageId);
  }catch(error){ alert(error.message); }
}

function chooseFile(accept){
  const input=$("fileInput");
  input.accept=accept;
  input.click();
}

async function uploadSelectedFile(event){
  const file=event.target.files?.[0];
  event.target.value="";
  if(!file || !activeFriend) return;
  if(file.size>50*1024*1024){ alert("That file is over 50 MB."); return; }

  const form=new FormData();
  form.append("file",file);
  try{
    const response=await fetch(API+"/upload/"+activeFriend.uid,{
      method:"POST",
      headers: token ? {Authorization:"Bearer "+token} : {},
      body:form
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(data.error||"Upload failed");
    appendMessage(data);
  }catch(error){ alert(error.message); }
}

let mediaRecorder=null,recordedChunks=[],recordingStream=null;
async function toggleRecording(){
  if(mediaRecorder && mediaRecorder.state==="recording"){
    mediaRecorder.stop();
    return;
  }
  if(!activeFriend) return;
  if(!navigator.mediaDevices?.getUserMedia){ alert("Voice recording is not supported by this browser."); return; }
  try{
    recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});
    recordedChunks=[];
    const preferred=MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
      ?"audio/webm;codecs=opus":"audio/webm";
    mediaRecorder=new MediaRecorder(recordingStream,{mimeType:preferred});
    mediaRecorder.ondataavailable=e=>{if(e.data.size) recordedChunks.push(e.data);};
    mediaRecorder.onstop=async()=>{
      recordingStream?.getTracks().forEach(t=>t.stop());
      $("voiceBtn").classList.remove("recording");
      $("voiceBtn").textContent="🎙️";
      const blob=new Blob(recordedChunks,{type:mediaRecorder.mimeType||"audio/webm"});
      if(blob.size>50*1024*1024) return;
      const file=new File([blob],"voice-"+Date.now()+".webm",{type:blob.type});
      const form=new FormData(); form.append("file",file);
      try{
        const response=await fetch(API+"/upload/"+activeFriend.uid,{
          method:"POST",headers:{Authorization:"Bearer "+token},body:form
        });
        const data=await response.json().catch(()=>({}));
        if(!response.ok) throw new Error(data.error||"Voice upload failed");
        appendMessage(data);
      }catch(error){alert(error.message);}
    };
    mediaRecorder.start(250);
    $("voiceBtn").classList.add("recording");
    $("voiceBtn").textContent="⏹️";
  }catch(error){ alert("Microphone permission was denied or unavailable."); }
}

/* SEND MESSAGE */
async function sendMessage(){
  if(!activeFriend) return;
  const input=$("messageInput");
  const text=input.value.trim();
  if(!text) return;

  input.value="";
  input.focus();

  try{
    const message=await api("/messages/"+activeFriend.uid,{
      method:"POST",
      body:JSON.stringify({text:text})
    });
    // Sender gets the response immediately; receiver gets the WebSocket event.
    appendMessage(message);
  }catch(error){
    input.value=text;
    alert(error.message);
  }
}



$("messageInput")
.addEventListener(
"keydown",
event => {

if(event.key === "Enter"){

event.preventDefault();

sendMessage();

}

});


/* REAL TIME */

function connectSocket(){

try{

if(socket)
socket.close();

}
catch{}

const protocol =
location.protocol === "https:"
? "wss"
: "ws";

socket =
new WebSocket(
protocol +
"://" +
location.host +
"/ws"
);

socket.onopen = () => {

socket.send(
JSON.stringify({
type:"auth",
token:token
})
);

};

socket.onmessage =
event => {

const message =
JSON.parse(event.data);

if(
message.type ===
"friend_request"
){

loadUser();

}

if(
message.type ===
"friend_accepted"
){

loadUser();

}

if(message.type === "message"){
  // IMPORTANT: do not refetch the whole chat. The server already sent
  // the exact new message, so it appears immediately.
  if(activeFriend && message.message && (
    message.message.from === activeFriend.uid ||
    message.message.from === me.uid
  )){
    appendMessage(message.message);
  }
}

if(message.type === "message_deleted"){
  removeMessage(message.messageId);
}

};

socket.onclose = () => {

setTimeout(
() => {

if(token)
connectSocket();

},
2000
);

};

}


/* LOG OUT */

function logout(){

localStorage.removeItem(
"felix_token"
);

location.reload();

}


/* START */

if(token){

loadUser();

}
else{

loginScreen();

}

</script>

<div id="storyViewer" class="story-viewer" onclick="closeStory(event)"><div class="story-viewer-box"><button class="story-close" onclick="closeStory(event)">×</button><div id="storyViewerMedia"></div><div id="storyViewerCaption" class="story-caption"></div></div></div>

<script>
// ---- Snapchat-style additions (keeps the original Felix Chat functions intact) ----
let storiesCache=[];
let typingTimer=null;

async function showStories(){
  try{storiesCache=await api('/stories');renderStories();if(!storiesCache.length)openModal('<h2>👻 Stories</h2><p>No stories yet. Add the first one!</p><button class="btn" onclick="closeModal()">Done</button>')}catch(e){alert(e.message)}
}
async function loadMyStories(){return await api('/stories/mine')}
function renderStories(){
  const strip=$('storyStrip');if(!strip)return;strip.innerHTML='';
  const add=document.createElement('div');add.className='story-card';add.innerHTML='<div class="story-ring story-add">＋</div><div class="small">Your story</div>';add.onclick=createStory;strip.appendChild(add);
  const mine=storiesCache.filter(st=>st.uid===me?.uid);
  if(mine.length){const c=document.createElement('div');c.className='story-card';c.innerHTML='<div class="story-ring story-add">👁</div><div class="small">Your stories</div>';c.onclick=showMyStories;strip.appendChild(c)}
  const seen=new Set();storiesCache.forEach(st=>{if(st.uid===me?.uid||seen.has(st.uid))return;seen.add(st.uid);const d=document.createElement('div');d.className='story-card';d.innerHTML=`<div class="story-ring"><img src="${st.avatar||''}" onerror="this.style.display='none'"></div><div class="small">${escapeHtml(st.displayName||st.username)}</div>`;d.onclick=()=>viewStory(st);strip.appendChild(d)})
}
function escapeHtml(x){const d=document.createElement('div');d.textContent=x??'';return d.innerHTML}
function createStory(){$('storyInput').click()}
async function uploadStory(e){const file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>50*1024*1024)return alert('Story is over 50 MB.');const caption=prompt('Story caption (optional):','')||'';const f=new FormData();f.append('file',file);f.append('caption',caption);try{const r=await fetch(API+'/stories',{method:'POST',headers:{Authorization:'Bearer '+token},body:f});const d=await r.json();if(!r.ok)throw new Error(d.error||'Story upload failed');await showStories()}catch(err){alert(err.message)}}
function viewStory(st){$('storyViewer').style.display='flex';const media=$('storyViewerMedia');media.innerHTML=st.kind==='video'?`<video src="${st.url}" controls autoplay></video>`:`<img src="${st.url}">`;$('storyViewerCaption').textContent=st.caption||('@'+st.username);if(st.uid!==me?.uid)api('/stories/'+st.id+'/view',{method:'POST'}).catch(()=>{})}
function closeStory(e){if(e&&e.target.closest('.story-viewer-box')&&!e.target.classList.contains('story-close'))return;$('storyViewer').style.display='none'}
async function showMyStories(){
  try{const mine=await loadMyStories();let html='<h2>👁 Your Stories</h2><p class="small">Only you can see this viewer list.</p>';if(!mine.length)html+='<p>No active stories.</p>';mine.forEach(st=>{html+=`<div class="request" style="display:block"><div style="display:flex;gap:10px;align-items:center"><div class="avatar">${st.kind==='video'?'🎥':'📷'}</div><b style="flex:1">${escapeHtml(st.caption||'Your story')}</b><span class="small">${st.views} view${st.views===1?'':'s'}</span></div><div style="margin-top:8px">${st.viewers.length?st.viewers.map(v=>`<span class="reaction-chip">👁 ${escapeHtml(v.displayName||v.username)}</span>`).join(' '):'<span class="small">Nobody has viewed this yet.</span>'}</div><div class="row"><button class="btn" onclick='viewStory(${JSON.stringify(st).replace(/'/g,"&#39;")})'>View</button><button class="btn" onclick="deleteStory('${st.id}')">Delete</button></div></div>`});html+='<button class="btn" onclick="closeModal()">Done</button>';openModal(html)}catch(e){alert(e.message)}
}
async function deleteStory(id){if(!confirm('Delete this story?'))return;try{await api('/stories/'+id,{method:'DELETE'});await showStories();showMyStories()}catch(e){alert(e.message)}}
function syncAdminButton(){
  const btn=$('adminBtn');
  if(!btn) return;
  const isAdmin=!!me && String(me.username||'').toLowerCase()==='felixchat';
  btn.style.display=isAdmin?'block':'none';
  btn.disabled=!isAdmin;
}
async function openAdminPanel(){
  if(!me || String(me.username||'').toLowerCase()!=='felixchat'){ alert('Admin access required'); return; }
  try{
    const status=await api('/admin/status');
    if(!status.admin){syncAdminButton();return alert('Admin access required');}
    openModal(`<h2>🛡️ FelixChat Admin</h2><p class="small">Ban or unban accounts. Only @felixchat can use this.</p><div class="row"><input id="adminUserSearch" class="input" placeholder="Search username..." onkeydown="if(event.key==='Enter')refreshAdminUsers()"><button class="btn primary" onclick="refreshAdminUsers()">Search</button></div><div id="adminUserResults" style="margin-top:12px">Loading...</div><button class="btn" onclick="closeModal()" style="margin-top:10px">Done</button>`);
    await refreshAdminUsers();
  }catch(e){alert(e.message)}
}
async function refreshAdminUsers(){
  const box=$('adminUserResults'); if(!box)return;
  try{
    const q=($('adminUserSearch')?.value||'').trim();
    const users=await api('/admin/users?q='+encodeURIComponent(q));
    if(!users.length){box.innerHTML='<p class="small">No users found.</p>';return;}
    box.innerHTML=users.map(u=>`<div class="request"><div class="avatar">${initials(u.username)}</div><b style="flex:1">@${escapeHtml(u.username)}<div class="small">${escapeHtml(u.displayName||u.username)}</div></b><span class="small">${u.banned?'🚫 Banned':'Active'}</span>${u.username==='felixchat'?'':u.banned?`<button class="btn primary" onclick="adminUnban('${u.uid}')">Unban</button>`:`<button class="btn" onclick="adminBan('${u.uid}','${escapeHtml(u.username)}')">Ban</button>`}</div>`).join('');
  }catch(e){box.innerHTML='<p class="small">'+escapeHtml(e.message)+'</p>';}
}
async function adminBan(uid,username){
  if(!confirm('Ban @'+username+'? They will be logged out immediately.'))return;
  try{await api('/admin/ban/'+uid,{method:'POST'});await refreshAdminUsers()}catch(e){alert(e.message)}
}
async function adminUnban(uid){
  try{await api('/admin/unban/'+uid,{method:'POST'});await refreshAdminUsers()}catch(e){alert(e.message)}
}

async function searchUsers(){const q=($('quickSearch')?.value||'').trim();if(!q)return;try{const users=await api('/users/search?q='+encodeURIComponent(q));let html='<h2>🔎 People</h2>';if(!users.length)html+='<p>No users found.</p>';users.forEach(u=>{html+=`<div class="request"><div class="avatar">${initials(u.username)}</div><b style="flex:1">@${escapeHtml(u.username)}<div class="small">${escapeHtml(u.displayName||u.username)}</div></b><button class="btn primary" onclick="sendFoundFriend('${u.username}')">Add</button></div>`});html+='<button class="btn" onclick="closeModal()">Done</button>';openModal(html)}catch(e){alert(e.message)}}
async function sendFoundFriend(username){try{await api('/friends/request',{method:'POST',body:JSON.stringify({username})});alert('Friend request sent!')}catch(e){alert(e.message)}}
function editProfile(){openModal(`<h2>👤 Edit profile</h2><input id="profileDisplay" class="input" placeholder="Display name" value="${escapeHtml(me?.displayName||me?.username||'')}"><br><br><textarea id="profileBio" class="input" rows="3" placeholder="Bio">${escapeHtml(me?.bio||'')}</textarea><br><br><input id="profileAvatar" class="input" placeholder="Avatar image URL (optional)" value="${escapeHtml(me?.avatar||'')}"><div class="row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveProfile()">Save</button></div>`)}
async function saveProfile(){try{await api('/profile',{method:'PATCH',body:JSON.stringify({displayName:$('profileDisplay').value,bio:$('profileBio').value,avatar:$('profileAvatar').value})});closeModal();await loadUser()}catch(e){alert(e.message)}}

// Notifications for incoming messages.
let notificationCount=0;
let notifications=[];
function updateNotificationBadge(){const b=$('notificationBadge');if(!b)return;b.textContent=notificationCount>99?'99+':String(notificationCount);b.style.display=notificationCount?'block':'none';}
async function loadUnreadNotifications(){try{const list=await api('/notifications/unread');notifications=list.map(x=>({uid:x.uid,name:x.displayName||x.username,text:x.kind==='image'?'📷 Photo':x.kind==='video'?'🎥 Video':x.kind==='voice'?'🎙️ Voice message':(x.text||'New message').slice(0,100),time:x.time}));notificationCount=notifications.length;updateNotificationBadge();}catch(e){}}
function notifyNewMessage(m){if(!m||!me||m.from===me.uid)return;const friend=me.friends?.find(f=>f.uid===m.from);const name=friend?.displayName||friend?.username||'Someone';const preview=m.kind==='image'?'📷 Photo':m.kind==='video'?'🎥 Video':m.kind==='voice'?'🎙️ Voice message':(m.text||'New message').slice(0,100);if(activeFriend&&activeFriend.uid===m.from){return;}notifications.unshift({uid:m.from,name,text:preview,time:Date.now()});notifications=notifications.slice(0,50);notificationCount++;updateNotificationBadge();showNotificationToast(name,preview,m.from);try{if('Notification'in window&&Notification.permission==='granted'&&document.visibilityState!=='visible'){const n=new Notification('@'+name,{body:preview});n.onclick=()=>{window.focus();openNotificationChat(m.from);n.close()}}}catch(e){}}
function showNotificationToast(name,text,uid){const old=document.querySelector('.toast-notification');if(old)old.remove();const t=document.createElement('div');t.className='toast-notification';t.innerHTML=`<b>💬 @${escapeHtml(name)}</b><span>${escapeHtml(text)}</span>`;t.onclick=()=>{openNotificationChat(uid);t.remove()};document.body.appendChild(t);setTimeout(()=>t.remove(),5000)}
async function requestNotificationPermission(){try{if('Notification'in window&&Notification.permission==='default')await Notification.requestPermission()}catch(e){}}
function showNotifications(){const items=notifications.length?notifications.map(n=>`<div class="notification-item" onclick="openNotificationChat('${n.uid}')"><b>💬 @${escapeHtml(n.name)}</b><div class="small">${escapeHtml(n.text)}</div></div>`).join(''):'<p>No unread messages.</p>';notificationCount=0;updateNotificationBadge();openModal(`<h2>🔔 Notifications</h2><p class="small">You'll be notified here when someone messages you.</p><div class="notification-list">${items}</div><div class="row"><button class="btn" onclick="requestNotificationPermission()">Enable desktop notifications</button><button class="btn" onclick="closeModal()">Done</button></div>`)}
function openNotificationChat(uid){const f=me?.friends?.find(x=>x.uid===uid);closeModal();if(f)selectFriend(f)}

// FelixChat-only commands: /ban username and /unban username.
async function handleAdminChatCommand(text){if(!me||String(me.username||'').toLowerCase()!=='felixchat')return false;const m=String(text||'').trim().match(/^\/(ban|unban)\s+([a-zA-Z0-9_]{3,20})$/i);if(!m)return false;try{const r=await api('/admin/command',{method:'POST',body:JSON.stringify({command:m[1].toLowerCase(),username:m[2].toLowerCase()})});showNotificationToast('FelixChat Admin',`@${r.username} ${r.action==='ban'?'was banned':'was unbanned'}`,me.uid)}catch(e){alert(e.message)}return true}

// Enhance message bubbles without replacing the existing media/delete implementation.
const originalMessageBubble=messageBubble;
messageBubble=function(message){const b=originalMessageBubble(message);if(message.from===me.uid||message.kind==='text'){const actions=document.createElement('div');actions.className='message-actions';const react=document.createElement('button');react.textContent='❤️';react.onclick=()=>reactToMessage(message.id,'❤️');actions.appendChild(react);if(message.kind==='text'&&message.from===me.uid){const edit=document.createElement('button');edit.textContent='Edit';edit.onclick=()=>editMessage(message);actions.appendChild(edit)}b.appendChild(actions)}return b}
async function reactToMessage(id,emoji){if(!activeFriend)return;try{await api('/messages/'+activeFriend.uid+'/'+id+'/react',{method:'POST',body:JSON.stringify({emoji})})}catch(e){alert(e.message)}}
async function editMessage(m){const text=prompt('Edit message:',m.text||'');if(text===null||!text.trim())return;try{await api('/messages/'+activeFriend.uid+'/'+m.id,{method:'PATCH',body:JSON.stringify({text})});await loadMessages()}catch(e){alert(e.message)}}

// Typing indicator + read receipts.
const originalSendMessage=sendMessage;
sendMessage=async function(){const input=$('messageInput');const text=input?.value?.trim()||'';if(await handleAdminChatCommand(text)){input.value='';return;}await originalSendMessage()}
$('messageInput').addEventListener('input',()=>{if(!activeFriend)return;api('/typing/'+activeFriend.uid,{method:'POST',body:JSON.stringify({typing:true})}).catch(()=>{});clearTimeout(typingTimer);typingTimer=setTimeout(()=>api('/typing/'+activeFriend.uid,{method:'POST',body:JSON.stringify({typing:false})}).catch(()=>{}),900)});
const originalConnectSocket=connectSocket;
connectSocket=function(){originalConnectSocket();setTimeout(()=>{if(socket){const old=socket.onmessage;socket.onmessage=(event)=>{try{const m=JSON.parse(event.data);if(m.type==='typing'&&activeFriend&&m.uid===activeFriend.uid){$('typingIndicator').textContent=m.typing?'typing...':''}if(m.type==='message'&&m.message)notifyNewMessage(m.message);if(m.type==='message_read'){const el=$('messages').querySelector('[data-message-id="'+CSS.escape(m.messageId)+'"]');if(el)el.title='Seen'}if(m.type==='message_edited'){const el=$('messages').querySelector('[data-message-id="'+CSS.escape(m.message.id)+'"]');if(el){el.replaceWith(messageBubble(m.message))}}if(m.type==='reaction'){}if(m.type==='story_added')showStories().catch(()=>{});if(m.type==='banned'){alert('Your account has been banned.');localStorage.removeItem('felix_token');location.reload()}}catch(e){} if(old)old(event)}}},50)};

const originalSelectFriend=selectFriend;
selectFriend=async function(friend){await originalSelectFriend(friend);mobileShowChat();$('typingIndicator').textContent='';setTimeout(()=>{document.querySelectorAll('#messages .message').forEach(el=>{const id=el.dataset.messageId;if(id)api('/messages/'+friend.uid+'/'+id+'/read',{method:'POST'}).catch(()=>{})})},250)};

function mobileShowChat(){if(window.innerWidth<=700){document.body.classList.add('mobile-chat-open');}}
function mobileShowChats(){if(window.innerWidth<=700){document.body.classList.remove('mobile-chat-open');activeFriend=null;$('messageInput').disabled=true;}}
const _mobileSelectFriend=selectFriend;
selectFriend=async function(friend){await _mobileSelectFriend(friend);mobileShowChat();};

// Load stories after authentication.
const originalLoadUser=loadUser;
loadUser=async function(){
  await originalLoadUser();
  syncAdminButton();
  try{storiesCache=await api('/stories');renderStories();}catch(e){}
  await loadUnreadNotifications();
  try{const status=await api('/admin/status');if(status.admin)syncAdminButton();}catch(e){}
}
setInterval(()=>{if(me && String(me.username||'').toLowerCase()==='felixchat')syncAdminButton()},1500);
</script>
