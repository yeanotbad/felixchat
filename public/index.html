<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
/>

<title>Felix Chat</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
font-family:Arial,sans-serif;
background:#080b16;
color:white;
}

.app{
height:100%;
display:flex;
}

.sidebar{
width:300px;
background:#0d1220;
border-right:1px solid #293650;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.logo{
font-size:25px;
font-weight:900;
margin-bottom:5px;
}

.profile{
display:flex;
align-items:center;
gap:10px;
padding:10px;
border-radius:14px;
background:#151c30;
}

.avatar{
width:42px;
height:42px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
background:linear-gradient(
135deg,
#7658ff,
#19d9ff
);
}

.small{
font-size:12px;
color:#8f9db7;
}

.online{
color:#49e79a;
}

button{
border:0;
cursor:pointer;
}

.btn{
width:100%;
padding:12px;
border-radius:12px;
background:#151e33;
border:1px solid #2c3854;
color:white;
font-weight:bold;
}

.primary{
background:linear-gradient(
135deg,
#7257ff,
#278cff
);
}

.request-button{
position:relative;
}

.badge{
position:absolute;
right:8px;
top:7px;
background:#ff496c;
border-radius:20px;
padding:2px 7px;
font-size:11px;
}

.friends{
overflow:auto;
}

.friend{
display:flex;
align-items:center;
gap:10px;
padding:10px;
border-radius:13px;
cursor:pointer;
}

.friend:hover,
.friend.active{
background:#1b2742;
}

.chat{
flex:1;
display:flex;
flex-direction:column;
min-width:0;
}

.chat-header{
height:70px;
padding:10px 18px;
display:flex;
align-items:center;
border-bottom:1px solid #293650;
}

.messages{
flex:1;
overflow:auto;
padding:18px;
display:flex;
flex-direction:column;
gap:10px;
}

.empty{
margin:auto;
text-align:center;
color:#8795ae;
}

.message{
max-width:75%;
padding:11px 14px;
border-radius:18px;
background:#151e32;
}

.message.mine{
align-self:flex-end;
background:linear-gradient(
135deg,
#7055ff,
#287eff
);
}

.composer{
display:flex;
gap:8px;
padding:10px;
border-top:1px solid #293650;
}

.message-input{
flex:1;
padding:13px;
border-radius:13px;
border:1px solid #2c3854;
background:#11192c;
color:white;
outline:none;
}

.send{
padding:0 18px;
border-radius:13px;
background:#7257ff;
color:white;
font-weight:bold;
}

.modal{
position:fixed;
inset:0;
background:#000b;
display:none;
align-items:center;
justify-content:center;
padding:18px;
}

.modal-box{
width:min(500px,100%);
background:#10182a;
border:1px solid #30405f;
border-radius:22px;
padding:22px;
}

.input{
width:100%;
padding:12px;
border-radius:12px;
border:1px solid #2c3854;
background:#11192c;
color:white;
}

.row{
display:flex;
gap:8px;
margin-top:10px;
}

.row>*{
flex:1;
}

.request{
display:flex;
align-items:center;
gap:10px;
padding:12px;
background:#151e32;
border-radius:13px;
margin:8px 0;
}


.message-tools{display:flex;justify-content:flex-end;margin-top:5px;opacity:0;transition:.15s}
.message:hover .message-tools{opacity:1}
.message-tools button{background:transparent;color:#b9c5df;border:0;font-size:12px;cursor:pointer}
.message-media{max-width:min(420px,75vw);max-height:360px;border-radius:14px;display:block}
.message-video{max-width:min(480px,75vw);max-height:360px;border-radius:14px;display:block}
.message-audio{width:min(360px,70vw)}
.composer-extra{display:flex;gap:6px}
.icon-btn{padding:0 12px;border-radius:13px;background:#151e33;border:1px solid #2c3854;color:#fff;font-weight:700}
.icon-btn.recording{background:#c83d5c}
#fileInput{display:none}
@media(max-width:700px){

.sidebar{
width:76px;
padding:9px;
}

.logo{
font-size:0;
}

.logo:first-letter{
font-size:25px;
}

.profile{
justify-content:center;
}

.profile-info{
display:none;
}

.friend{
justify-content:center;
}

.friend-info{
display:none;
}

.sidebar .btn{
font-size:0;
}

.sidebar .primary{
font-size:20px;
}

.chat-header{
height:64px;
}

.message{
max-width:90%;
}

}

.video-message{position:relative}.video-message-wrap{position:relative;display:inline-block}.video-save-menu{position:absolute;left:8px;bottom:8px;z-index:20;background:#10182aee;border:1px solid #30405f;border-radius:12px;padding:6px;box-shadow:0 10px 30px #0008}.video-save-menu button{border:0;background:#1b2742;color:#fff;padding:10px 12px;border-radius:9px;font-weight:700;cursor:pointer;white-space:nowrap}.video-save-menu button:hover{background:#26385d}</style>

</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="logo">
💬 Felix Chat
</div>

<div class="profile">

<div
class="avatar"
id="myAvatar"
>
F
</div>

<div class="profile-info">

<b id="myName">
You
</b>

<div class="small online">
● Online
</div>

</div>

</div>

<button
class="btn request-button"
onclick="showRequests()"
>

🔔 Friend Requests

<span
id="requestBadge"
class="badge"
style="display:none"
>
0
</span>

</button>

<div
id="friends"
class="friends"
>
</div>

<div style="flex:1">
</div>

<button
class="btn primary"
onclick="addFriend()"
>
＋ Add Friend
</button>

<button
class="btn"
onclick="logout()"
>
Log Out
</button>

</aside>

<main class="chat">

<header class="chat-header">

<div class="profile">

<div
class="avatar"
id="friendAvatar"
>
?
</div>

<div>

<b id="friendName">
Felix Chat
</b>

<div
class="small"
id="friendStatus"
>
Choose a friend
</div>

</div>

</div>

</header>

<section
id="messages"
class="messages"
>

<div class="empty">

👋 Welcome to Felix Chat

<br><br>

Add a friend to start chatting.

</div>

</section>

<footer class="composer">

<input
id="messageInput"
class="message-input"
placeholder="Message..."
disabled
/>

<div class="composer-extra">
<button class="icon-btn" id="imageBtn" onclick="chooseFile('image/*')" title="Send image">🖼️</button>
<button class="icon-btn" id="videoBtn" onclick="chooseFile('video/*')" title="Send video">🎥</button>
<button class="icon-btn" id="voiceBtn" onclick="toggleRecording()" title="Record voice">🎙️</button>
</div>
<input id="fileInput" type="file" accept="image/*,video/*" onchange="uploadSelectedFile(event)">

<button class="send" onclick="sendMessage()">Send</button>

</footer>

</main>

</div>


<div
id="modal"
class="modal"
>

<div
id="modalBox"
class="modal-box"
>
</div>

</div>


<script>

const API =
location.origin + "/api";

let token =
localStorage.getItem("felix_token");

let me = null;

let activeFriend = null;

let socket = null;


function $(id){
return document.getElementById(id);
}


function initials(name){

return (name || "?")
.slice(0,2)
.toUpperCase();

}


function openModal(html){

$("modalBox").innerHTML =
html;

$("modal").style.display =
"flex";

}


function closeModal(){

$("modal").style.display =
"none";

}


async function api(url,options={}){

options.headers = {

"Content-Type":
"application/json",

...(options.headers || {})

};

if(token){

options.headers.Authorization =
"Bearer " + token;

}

const response =
await fetch(API + url,options);

const data =
await response.json()
.catch(()=>({}));

if(!response.ok){

throw new Error(
data.error ||
"Something went wrong"
);

}

return data;

}


/* LOGIN */

function loginScreen(){

openModal(`

<h2>💬 Felix Chat</h2>

<p>Create an account or log in.</p>

<input
id="username"
class="input"
placeholder="Username"
/>

<br><br>

<input
id="password"
class="input"
type="password"
placeholder="Password"
/>

<div class="row">

<button
class="btn primary"
onclick="register()"
>
Create Account
</button>

<button
class="btn"
onclick="login()"
>
Log In
</button>

</div>

`);

}


async function register(){

try{

const data =
await api(
"/register",
{
method:"POST",
body:JSON.stringify({

username:
$("username").value,

password:
$("password").value

})
}
);

token =
data.token;

localStorage.setItem(
"felix_token",
token
);

closeModal();

loadUser();

}

catch(error){

alert(error.message);

}

}


async function login(){

try{

const data =
await api(
"/login",
{
method:"POST",
body:JSON.stringify({

username:
$("username").value,

password:
$("password").value

})
}
);

token =
data.token;

localStorage.setItem(
"felix_token",
token
);

closeModal();

loadUser();

}

catch(error){

alert(error.message);

}

}


/* LOAD USER */

async function loadUser(){

try{

me =
await api("/me");

$("myName").textContent =
"@" + me.username;

$("myAvatar").textContent =
initials(me.username);

renderFriends();

connectSocket();

}

catch{

localStorage.removeItem(
"felix_token"
);

token = null;

loginScreen();

}

}


/* FRIEND LIST */

function renderFriends(){

const container =
$("friends");

container.innerHTML = "";

me.friends.forEach(friend => {

const element =
document.createElement("div");

element.className =
"friend";

if(
activeFriend &&
activeFriend.uid === friend.uid
){

element.classList.add(
"active"
);

}

element.innerHTML = `

<div class="avatar">

${initials(friend.username)}

</div>

<div class="friend-info">

<b>
@${friend.username}
</b>

<div class="small">

${friend.online
? "● Online"
: "○ Offline"}

</div>

</div>

`;

element.onclick =
()=>selectFriend(friend);

container.appendChild(element);

});


const count =
me.requests.length;

$("requestBadge").textContent =
count;

$("requestBadge").style.display =
count
? "block"
: "none";

}


/* FRIEND REQUEST WINDOW */

async function showRequests(){

await loadUser();

let html = `

<h2>
🔔 Friend Requests
</h2>

`;

if(me.requests.length === 0){

html += `

<p>
You don't have any friend requests.
</p>

`;

}

else{

me.requests.forEach(request => {

html += `

<div class="request">

<div class="avatar">

${initials(request.username)}

</div>

<b style="flex:1">

@${request.username}

</b>

<button
class="btn primary"
onclick="acceptRequest('${request.uid}')"
>
✓ Accept
</button>

<button
class="btn"
onclick="declineRequest('${request.uid}')"
>
✕
</button>

</div>

`;

});

}

html += `

<button
class="btn"
onclick="closeModal()"
style="margin-top:10px"
>
Done
</button>

`;

openModal(html);

}


/* ACCEPT */

async function acceptRequest(uid){

try{

await api(
"/friends/accept",
{
method:"POST",
body:JSON.stringify({
uid:uid
})
}
);

closeModal();

await loadUser();

}

catch(error){

alert(error.message);

}

}


/* DECLINE */

async function declineRequest(uid){

try{

await api(
"/friends/decline",
{
method:"POST",
body:JSON.stringify({
uid:uid
})
}
);

showRequests();

}

catch(error){

alert(error.message);

}

}


/* ADD FRIEND */

function addFriend(){

openModal(`

<h2>
👥 Add Friend
</h2>

<input
id="friendUsername"
class="input"
placeholder="Friend's username"
/>

<div class="row">

<button
class="btn"
onclick="closeModal()"
>
Cancel
</button>

<button
class="btn primary"
onclick="sendFriendRequest()"
>
Send Request
</button>

</div>

`);

}


async function sendFriendRequest(){

try{

await api(
"/friends/request",
{
method:"POST",
body:JSON.stringify({

username:
$("friendUsername").value

})
}
);

closeModal();

alert(
"Friend request sent!"
);

}

catch(error){

alert(error.message);

}

}


/* SELECT FRIEND */

async function selectFriend(friend){

activeFriend =
friend;

$("friendName").textContent =
"@" + friend.username;

$("friendAvatar").textContent =
initials(friend.username);

$("friendStatus").textContent =
friend.online
? "● Online"
: "○ Offline";

$("messageInput").disabled =
false;

renderFriends();

loadMessages();

}


/* MESSAGES — render once, then apply realtime events directly */
function messageBubble(message){
  const bubble=document.createElement("div");
  bubble.className="message"+(message.from===me.uid?" mine":"");
  bubble.dataset.messageId=message.id;

  if(message.kind==="image"){
    const img=document.createElement("img");
    img.className="message-media"; img.src=message.url; img.alt=message.name||"Image"; img.loading="lazy";
    bubble.appendChild(img);
  }else if(message.kind==="video"){
    const mediaWrap=document.createElement("div");
    mediaWrap.className="video-message-wrap";
    const v=document.createElement("video");
    v.className="message-video"; v.controls=true; v.preload="metadata"; v.src=message.url;
    mediaWrap.appendChild(v);
    let pressTimer=null;
    const showSave=()=>{
      document.querySelectorAll(".video-save-menu").forEach(x=>x.remove());
      const menu=document.createElement("div");
      menu.className="video-save-menu";
      const saveBtn=document.createElement("button");
      saveBtn.textContent="💾 Save to camera roll";
      saveBtn.onclick=async()=>{
        menu.remove();
        try{
          const response=await fetch(message.url);
          const blob=await response.blob();
          const blobUrl=URL.createObjectURL(blob);
          const a=document.createElement("a");
          a.href=blobUrl;
          a.download=message.name||("felix-video-"+Date.now()+".mp4");
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(()=>URL.revokeObjectURL(blobUrl),2000);
        }catch(error){
          const a=document.createElement("a"); a.href=message.url; a.download=message.name||"felix-video.mp4"; a.target="_blank"; a.click();
        }
      };
      menu.appendChild(saveBtn); mediaWrap.appendChild(menu);
      setTimeout(()=>menu.remove(),5000);
    };
    const startPress=()=>{pressTimer=setTimeout(showSave,550);};
    const cancelPress=()=>{if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}};
    v.addEventListener("pointerdown",startPress);
    ["pointerup","pointercancel","pointerleave"].forEach(ev=>v.addEventListener(ev,cancelPress));
    v.addEventListener("contextmenu",e=>{e.preventDefault();showSave();});
    bubble.appendChild(mediaWrap);
  }else if(message.kind==="voice"){
    const a=document.createElement("audio");
    a.className="message-audio"; a.controls=true; a.preload="metadata"; a.src=message.url;
    bubble.appendChild(a);
  }else{
    bubble.appendChild(document.createTextNode(message.text||""));
  }

  if(message.from===me.uid){
    const tools=document.createElement("div");
    tools.className="message-tools";
    const del=document.createElement("button");
    del.textContent="Delete";
    del.onclick=()=>deleteMessage(message.id);
    tools.appendChild(del);
    bubble.appendChild(tools);
  }
  return bubble;
}

function appendMessage(message,scroll=true){
  if(!activeFriend || !message) return;
  if($("messages").querySelector(`[data-message-id="${CSS.escape(message.id)}"]`)) return;
  const empty=$("messages").querySelector(".empty");
  if(empty) empty.remove();
  $("messages").appendChild(messageBubble(message));
  if(scroll) $("messages").scrollTop=$("messages").scrollHeight;
}

async function loadMessages(){
  if(!activeFriend) return;
  try{
    const messages=await api("/messages/"+activeFriend.uid);
    const container=$("messages");
    container.innerHTML="";
    if(!messages.length){
      container.innerHTML='<div class="empty">No messages yet.<br>Say hello! 👋</div>';
      return;
    }
    const fragment=document.createDocumentFragment();
    messages.forEach(message=>fragment.appendChild(messageBubble(message)));
    container.appendChild(fragment);
    container.scrollTop=container.scrollHeight;
  }catch(error){ console.log(error); }
}

function removeMessage(messageId){
  const node=$("messages").querySelector(`[data-message-id="${CSS.escape(messageId)}"]`);
  if(node) node.remove();
  if(!$("messages").querySelector(".message")){
    $("messages").innerHTML='<div class="empty">No messages yet.<br>Say hello! 👋</div>';
  }
}

async function deleteMessage(messageId){
  if(!activeFriend || !confirm("Delete this message?")) return;
  try{
    await api("/messages/"+activeFriend.uid+"/"+messageId,{method:"DELETE"});
    // Server broadcasts the deletion to both sides. Removing here too makes
    // the local UI feel instant even before the WebSocket event arrives.
    removeMessage(messageId);
  }catch(error){ alert(error.message); }
}

function chooseFile(accept){
  const input=$("fileInput");
  input.accept=accept;
  input.click();
}

async function uploadSelectedFile(event){
  const file=event.target.files?.[0];
  event.target.value="";
  if(!file || !activeFriend) return;
  if(file.size>50*1024*1024){ alert("That file is over 50 MB."); return; }

  const form=new FormData();
  form.append("file",file);
  try{
    const response=await fetch(API+"/upload/"+activeFriend.uid,{
      method:"POST",
      headers: token ? {Authorization:"Bearer "+token} : {},
      body:form
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok) throw new Error(data.error||"Upload failed");
    appendMessage(data);
  }catch(error){ alert(error.message); }
}

let mediaRecorder=null,recordedChunks=[],recordingStream=null;
async function toggleRecording(){
  if(mediaRecorder && mediaRecorder.state==="recording"){
    mediaRecorder.stop();
    return;
  }
  if(!activeFriend) return;
  if(!navigator.mediaDevices?.getUserMedia){ alert("Voice recording is not supported by this browser."); return; }
  try{
    recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});
    recordedChunks=[];
    const preferred=MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
      ?"audio/webm;codecs=opus":"audio/webm";
    mediaRecorder=new MediaRecorder(recordingStream,{mimeType:preferred});
    mediaRecorder.ondataavailable=e=>{if(e.data.size) recordedChunks.push(e.data);};
    mediaRecorder.onstop=async()=>{
      recordingStream?.getTracks().forEach(t=>t.stop());
      $("voiceBtn").classList.remove("recording");
      $("voiceBtn").textContent="🎙️";
      const blob=new Blob(recordedChunks,{type:mediaRecorder.mimeType||"audio/webm"});
      if(blob.size>50*1024*1024) return;
      const file=new File([blob],"voice-"+Date.now()+".webm",{type:blob.type});
      const form=new FormData(); form.append("file",file);
      try{
        const response=await fetch(API+"/upload/"+activeFriend.uid,{
          method:"POST",headers:{Authorization:"Bearer "+token},body:form
        });
        const data=await response.json().catch(()=>({}));
        if(!response.ok) throw new Error(data.error||"Voice upload failed");
        appendMessage(data);
      }catch(error){alert(error.message);}
    };
    mediaRecorder.start(250);
    $("voiceBtn").classList.add("recording");
    $("voiceBtn").textContent="⏹️";
  }catch(error){ alert("Microphone permission was denied or unavailable."); }
}

/* SEND MESSAGE */
async function sendMessage(){
  if(!activeFriend) return;
  const input=$("messageInput");
  const text=input.value.trim();
  if(!text) return;

  input.value="";
  input.focus();

  try{
    const message=await api("/messages/"+activeFriend.uid,{
      method:"POST",
      body:JSON.stringify({text:text})
    });
    // Sender gets the response immediately; receiver gets the WebSocket event.
    appendMessage(message);
  }catch(error){
    input.value=text;
    alert(error.message);
  }
}



$("messageInput")
.addEventListener(
"keydown",
event => {

if(event.key === "Enter"){

event.preventDefault();

sendMessage();

}

});


/* REAL TIME */

function connectSocket(){

try{

if(socket)
socket.close();

}
catch{}

const protocol =
location.protocol === "https:"
? "wss"
: "ws";

socket =
new WebSocket(
protocol +
"://" +
location.host +
"/ws"
);

socket.onopen = () => {

socket.send(
JSON.stringify({
type:"auth",
token:token
})
);

};

socket.onmessage =
event => {

const message =
JSON.parse(event.data);

if(
message.type ===
"friend_request"
){

loadUser();

}

if(
message.type ===
"friend_accepted"
){

loadUser();

}

if(message.type === "message"){
  // IMPORTANT: do not refetch the whole chat. The server already sent
  // the exact new message, so it appears immediately.
  if(activeFriend && message.message && (
    message.message.from === activeFriend.uid ||
    message.message.from === me.uid
  )){
    appendMessage(message.message);
  }
}

if(message.type === "message_deleted"){
  removeMessage(message.messageId);
}

};

socket.onclose = () => {

setTimeout(
() => {

if(token)
connectSocket();

},
2000
);

};

}


/* LOG OUT */

function logout(){

localStorage.removeItem(
"felix_token"
);

location.reload();

}


/* START */

if(token){

loadUser();

}
else{

loginScreen();

}

</script>

</body>

</html>
