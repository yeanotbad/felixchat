<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Felix Chat</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100dvh;font-family:Arial,sans-serif;background:#080b16;color:#fff}.app{height:100%;display:flex;background:radial-gradient(circle at 80% 0,#29366d,#080b16 50%)}
.sidebar{width:300px;background:#0d1220f5;border-right:1px solid #293650;padding:14px;display:flex;flex-direction:column;gap:9px}.logo{font-size:24px;font-weight:900}.profile{display:flex;align-items:center;gap:10px;padding:9px;border-radius:14px;background:#151c30}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#7658ff,#19d9ff);flex:none}.small{font-size:12px;color:#8f9db7}.online{color:#49e79a}.btn,.icon-btn{border:1px solid #2c3854;background:#151e33;color:#fff;border-radius:12px;padding:11px;font-weight:700;cursor:pointer}.primary{border:0;background:linear-gradient(135deg,#7257ff,#278cff)}.request-button{position:relative}.badge{position:absolute;right:8px;top:6px;background:#ff496c;border-radius:20px;padding:2px 7px;font-size:11px}.friends{overflow:auto}.friend{display:flex;align-items:center;gap:10px;padding:9px;border-radius:13px;cursor:pointer}.friend:hover,.friend.active{background:#1b2742}.chat{flex:1;display:flex;flex-direction:column;min-width:0}.chat-header{height:70px;padding:9px 16px;display:flex;align-items:center;border-bottom:1px solid #293650;background:#0b1020e8}.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:9px}.empty{margin:auto;text-align:center;color:#8795ae}.message{position:relative;max-width:min(75%,600px);padding:10px 13px;border-radius:18px;background:#151e32;word-break:break-word}.message.mine{align-self:flex-end;background:linear-gradient(135deg,#7055ff,#287eff)}.message-time{font-size:10px;opacity:.6;margin-top:4px}.message-tools{display:flex;gap:4px;justify-content:flex-end;margin-top:4px;opacity:0}.message:hover .message-tools{opacity:1}.message-tools button{background:transparent;color:#d7def0;border:0;cursor:pointer;font-size:11px}.message-media{max-width:min(420px,70vw);max-height:360px;border-radius:14px;display:block}.message-video{max-width:min(480px,70vw);max-height:360px;border-radius:14px;display:block}.message-audio{width:min(360px,70vw)}.reaction{margin-top:5px;font-size:13px}.composer{display:flex;gap:7px;padding:9px;border-top:1px solid #293650;background:#0b1020}.message-input{flex:1;padding:12px;border-radius:13px;border:1px solid #2c3854;background:#11192c;color:#fff;outline:0}.send{padding:0 17px;border:0;border-radius:13px;background:#7257ff;color:#fff;font-weight:bold}.composer-extra{display:flex;gap:5px}.icon-btn{padding:0 11px}.recording{background:#c83d5c}.typing{height:20px;padding:0 18px;color:#8f9db7;font-size:12px}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-box{width:min(520px,100%);max-height:90vh;overflow:auto;background:#10182a;border:1px solid #30405f;border-radius:22px;padding:22px}.input{width:100%;padding:12px;border-radius:12px;border:1px solid #2c3854;background:#11192c;color:#fff}.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}.stories{display:flex;gap:8px;overflow:auto;padding:2px 0 5px}.story{min-width:58px;text-align:center;font-size:10px;color:#b9c5df;cursor:pointer}.story .avatar{width:50px;height:50px;margin:auto;border:2px solid #8a5cff}.emoji-row{display:flex;gap:5px;margin-top:6px}.emoji-row button{border:0;background:#11192c;border-radius:9px;padding:5px;cursor:pointer}.file-card{display:block;color:white;text-decoration:none;padding:8px;background:#10192b;border-radius:10px}.search{margin-bottom:7px}.hidden{display:none}
@media(max-width:700px){.sidebar{width:76px;padding:8px}.logo{font-size:0}.logo:first-letter{font-size:25px}.profile{justify-content:center}.profile-info,.friend-info,.sidebar .btn:not(.primary),.stories{display:none}.friend{justify-content:center}.chat-header{height:64px}.message{max-width:90%}.composer-extra .icon-btn{padding:0 8px}.message-input{min-width:0}}
</style></head><body>
<div class="app"><aside class="sidebar"><div class="logo">💬 Felix Chat</div><div class="profile"><div class="avatar" id="myAvatar">F</div><div class="profile-info"><b id="myName">You</b><div class="small online">● Online</div></div></div>
<div class="stories" id="stories"></div><button class="btn" onclick="createStory()">✨ My Story</button><button class="btn request-button" onclick="showRequests()">🔔 Friend Requests<span id="requestBadge" class="badge" style="display:none">0</span></button>
<input id="friendSearch" class="input search" placeholder="Search friends…" oninput="renderFriends()"><div id="friends" class="friends"></div><div style="flex:1"></div><button class="btn primary" onclick="addFriend()">＋ Add Friend</button><button class="btn" onclick="logout()">Log Out</button></aside>
<main class="chat"><header class="chat-header"><div class="profile" style="background:transparent"><div class="avatar" id="friendAvatar">?</div><div><b id="friendName">Felix Chat</b><div class="small" id="friendStatus">Choose a friend</div></div></div></header><section id="messages" class="messages"><div class="empty">👋 Welcome to Felix Chat<br><br>Add a friend to start chatting.</div></section><div id="typing" class="typing"></div><footer class="composer"><input id="messageInput" class="message-input" placeholder="Message…" disabled autocomplete="off"><div class="composer-extra"><button class="icon-btn" onclick="emoji('😀')">😀</button><button class="icon-btn" onclick="chooseFile('image/*')">🖼️</button><button class="icon-btn" onclick="chooseFile('video/*')">🎥</button><button class="icon-btn" id="voiceBtn" onclick="toggleRecording()">🎙️</button></div><input id="fileInput" type="file" style="display:none" onchange="uploadSelectedFile(event)"><button class="send" onclick="sendMessage()">Send</button></footer></main></div>
<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
<script>
const API=location.origin+"/api";let token=localStorage.getItem("felix_token"),me=null,activeFriend=null,socket=null,lastMessageTime=0,typingTimer=null,pollTimer=null,mediaRecorder=null,recordedChunks=[],recordingStream=null;
const $=id=>document.getElementById(id);const initials=n=>(n||"?").slice(0,2).toUpperCase();const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
function openModal(html){$("modalBox").innerHTML=html;$("modal").style.display="flex"}function closeModal(){$("modal").style.display="none"}
async function api(url,opt={}){opt.headers={"Content-Type":"application/json",...(opt.headers||{})};if(token)opt.headers.Authorization="Bearer "+token;const r=await fetch(API+url,opt),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
function loginScreen(){openModal(`<h2>💬 Felix Chat</h2><p>Create an account or log in.</p><input id="username" class="input" placeholder="Username"><br><br><input id="password" class="input" type="password" placeholder="Password"><div class="row"><button class="btn primary" onclick="register()">Create Account</button><button class="btn" onclick="login()">Log In</button></div>`)}
async function register(){try{const d=await api("/register",{method:"POST",body:JSON.stringify({username:$("username").value,password:$("password").value})});token=d.token;localStorage.setItem("felix_token",token);closeModal();loadUser()}catch(e){alert(e.message)}}
async function login(){try{const d=await api("/login",{method:"POST",body:JSON.stringify({username:$("username").value,password:$("password").value})});token=d.token;localStorage.setItem("felix_token",token);closeModal();loadUser()}catch(e){alert(e.message)}}
async function loadUser(){try{me=await api("/me");$("myName").textContent="@"+me.username;$("myAvatar").textContent=initials(me.username);renderFriends();connectSocket();loadStories()}catch{localStorage.removeItem("felix_token");token=null;loginScreen()}}
function renderFriends(){const q=$("friendSearch").value.toLowerCase();const c=$("friends");c.innerHTML="";(me?.friends||[]).filter(f=>f.username.includes(q)).forEach(f=>{const e=document.createElement("div");e.className="friend"+(activeFriend?.uid===f.uid?" active":"");e.innerHTML=`<div class="avatar">${initials(f.username)}</div><div class="friend-info"><b>@${esc(f.username)}</b><div class="small">${f.online?"● Online":"○ Offline"}</div></div>`;e.onclick=()=>selectFriend(f);c.appendChild(e)});const n=me?.requests?.length||0;$("requestBadge").textContent=n;$("requestBadge").style.display=n?"block":"none"}
async function showRequests(){await loadUser();let h=`<h2>🔔 Friend Requests</h2>`;if(!me.requests.length)h+=`<p>No friend requests.</p>`;me.requests.forEach(r=>h+=`<div class="row"><b style="flex:1">@${esc(r.username)}</b><button class="btn primary" onclick="acceptRequest('${r.uid}')">✓ Accept</button><button class="btn" onclick="declineRequest('${r.uid}')">✕</button></div>`);h+=`<button class="btn" style="margin-top:10px" onclick="closeModal()">Done</button>`;openModal(h)}
async function acceptRequest(uid){try{await api("/friends/accept",{method:"POST",body:JSON.stringify({uid})});closeModal();loadUser()}catch(e){alert(e.message)}}async function declineRequest(uid){try{await api("/friends/decline",{method:"POST",body:JSON.stringify({uid})});showRequests()}catch(e){alert(e.message)}}
function addFriend(){openModal(`<h2>👥 Add Friend</h2><input id="friendUsername" class="input" placeholder="Friend's username"><div class="row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="sendFriendRequest()">Send Request</button></div>`)}
async function sendFriendRequest(){try{await api("/friends/request",{method:"POST",body:JSON.stringify({username:$("friendUsername").value})});closeModal();alert("Friend request sent!")}catch(e){alert(e.message)}}
async function selectFriend(f){activeFriend=f;$("friendName").textContent="@"+f.username;$("friendAvatar").textContent=initials(f.username);$("friendStatus").textContent=f.online?"● Online":"○ Offline";$("messageInput").disabled=false;renderFriends();await loadMessages();markRead()}
function formatTime(t){return new Date(t).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}
function messageBubble(m){const b=document.createElement("div");b.className="message"+(m.from===me.uid?" mine":"");b.dataset.messageId=m.id;
if(m.kind==="image"){const x=document.createElement("img");x.className="message-media";x.src=m.url;x.alt=m.name||"Image";x.loading="lazy";b.appendChild(x)}else if(m.kind==="video"){const x=document.createElement("video");x.className="message-video";x.controls=true;x.preload="metadata";x.src=m.url;b.appendChild(x)}else if(m.kind==="voice"){const x=document.createElement("audio");x.className="message-audio";x.controls=true;x.src=m.url;b.appendChild(x)}else if(m.kind==="file"){const x=document.createElement("a");x.className="file-card";x.href=m.url;x.target="_blank";x.textContent="📎 "+(m.name||"File");b.appendChild(x)}else{b.appendChild(document.createTextNode(m.text||""))}
const reactions=Object.values(m.reactions||{});if(reactions.length){const r=document.createElement("div");r.className="reaction";r.textContent=[...new Set(reactions)].join(" ");b.appendChild(r)}
const meta=document.createElement("div");meta.className="message-time";meta.textContent=formatTime(m.time)+(m.edited?" · edited":"")+(m.from===me.uid&&m.seenBy?.length?" · Seen":"");b.appendChild(meta);
const tools=document.createElement("div");tools.className="message-tools";for(const [emojiTxt,fn] of [["❤️",()=>react(m.id,"❤️")],["😂",()=>react(m.id,"😂")],["👍",()=>react(m.id,"👍")]]){const q=document.createElement("button");q.textContent=emojiTxt;q.onclick=fn;tools.appendChild(q)}if(m.from===me.uid){if(m.kind==="text"){const e=document.createElement("button");e.textContent="Edit";e.onclick=()=>editMessage(m);tools.appendChild(e)}const d=document.createElement("button");d.textContent="Delete";d.onclick=()=>deleteMessage(m.id);tools.appendChild(d)}b.appendChild(tools);return b}
function appendMessage(m,scroll=true){if(!activeFriend||!m)return;if($("messages").querySelector(`[data-message-id="${CSS.escape(m.id)}"]`)){updateMessage(m);return}const empty=$("messages").querySelector(".empty");if(empty)empty.remove();$("messages").appendChild(messageBubble(m));if(scroll)$("messages").scrollTop=$("messages").scrollHeight;lastMessageTime=Math.max(lastMessageTime,Number(m.time)||0)}
function updateMessage(m){const old=$("messages").querySelector(`[data-message-id="${CSS.escape(m.id)}"]`);if(old)old.replaceWith(messageBubble(m))}
async function loadMessages(){if(!activeFriend)return;try{const arr=await api("/messages/"+activeFriend.uid);$("messages").innerHTML="";if(!arr.length){$("messages").innerHTML='<div class="empty">No messages yet.<br>Say hello! 👋</div>';lastMessageTime=0;return}const f=document.createDocumentFragment();arr.forEach(m=>f.appendChild(messageBubble(m)));$("messages").appendChild(f);$("messages").scrollTop=$("messages").scrollHeight;lastMessageTime=arr[arr.length-1].time||0}catch(e){console.log(e)}}
async function syncFallback(){if(!activeFriend||!token)return;try{const arr=await api(`/messages/${activeFriend.uid}?after=${lastMessageTime}`);arr.forEach(m=>appendMessage(m));if(arr.length)markRead()}catch{}}
function removeMessage(id){const n=$("messages").querySelector(`[data-message-id="${CSS.escape(id)}"]`);if(n)n.remove();if(!$("messages").querySelector(".message"))$("messages").innerHTML='<div class="empty">No messages yet.<br>Say hello! 👋</div>'}
async function deleteMessage(id){if(!activeFriend||!confirm("Delete this message?"))return;try{await api(`/messages/${activeFriend.uid}/${id}`,{method:"DELETE"});removeMessage(id)}catch(e){alert(e.message)}}
async function editMessage(m){const text=prompt("Edit message",m.text);if(text===null||!text.trim())return;try{const x=await api(`/messages/${activeFriend.uid}/${m.id}`,{method:"PATCH",body:JSON.stringify({text})});updateMessage(x)}catch(e){alert(e.message)}}
async function react(id,emoji){if(!activeFriend)return;try{const x=await api(`/messages/${activeFriend.uid}/react`,{method:"POST",body:JSON.stringify({messageId:id,emoji})});updateMessage(x)}catch(e){alert(e.message)}}
function chooseFile(accept){const x=$("fileInput");x.accept=accept;x.click()}
async function uploadSelectedFile(e){const file=e.target.files?.[0];e.target.value="";if(!file||!activeFriend)return;if(file.size>50*1024*1024)return alert("Maximum file size is 50 MB.");const f=new FormData();f.append("file",file);try{const r=await fetch(API+"/upload/"+activeFriend.uid,{method:"POST",headers:{Authorization:"Bearer "+token},body:f}),d=await r.json();if(!r.ok)throw Error(d.error||"Upload failed");appendMessage(d)}catch(x){alert(x.message)}}
async function toggleRecording(){if(mediaRecorder?.state==="recording"){mediaRecorder.stop();return}if(!activeFriend)return;if(!navigator.mediaDevices?.getUserMedia)return alert("Voice recording isn't supported here.");try{recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});recordedChunks=[];mediaRecorder=new MediaRecorder(recordingStream,{mimeType:MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?"audio/webm;codecs=opus":"audio/webm"});mediaRecorder.ondataavailable=e=>e.data.size&&recordedChunks.push(e.data);mediaRecorder.onstop=async()=>{recordingStream?.getTracks().forEach(t=>t.stop());$("voiceBtn").classList.remove("recording");$("voiceBtn").textContent="🎙️";const blob=new Blob(recordedChunks,{type:mediaRecorder.mimeType||"audio/webm"});const file=new File([blob],"voice-"+Date.now()+".webm",{type:blob.type});const f=new FormData();f.append("file",file);try{const r=await fetch(API+"/upload/"+activeFriend.uid,{method:"POST",headers:{Authorization:"Bearer "+token},body:f}),d=await r.json();if(!r.ok)throw Error(d.error||"Voice upload failed");appendMessage(d)}catch(x){alert(x.message)}};mediaRecorder.start(200);$("voiceBtn").classList.add("recording");$("voiceBtn").textContent="⏹️"}catch{alert("Microphone permission was denied.")}}
function emoji(e){const i=$("messageInput");i.value+=e;i.focus()}
async function sendMessage(){if(!activeFriend)return;const i=$("messageInput"),text=i.value.trim();if(!text)return;i.value="";try{const m=await api("/messages/"+activeFriend.uid,{method:"POST",body:JSON.stringify({text})});appendMessage(m)}catch(e){i.value=text;alert(e.message)}}
async function typing(){if(!activeFriend)return;try{await api("/presence/"+activeFriend.uid,{method:"POST",body:JSON.stringify({typing:true})});clearTimeout(typingTimer);typingTimer=setTimeout(()=>api("/presence/"+activeFriend.uid,{method:"POST",body:JSON.stringify({typing:false})}).catch(()=>{}),900)}catch{}}
async function markRead(){if(!activeFriend)return;try{await api("/read/"+activeFriend.uid,{method:"POST",body:JSON.stringify({upTo:Date.now()})})}catch{}}
$("messageInput").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();sendMessage()}else typing()});$("messageInput").addEventListener("input",typing);$("messages").addEventListener("scroll",()=>{if(activeFriend)markRead()});
function connectSocket(){try{socket?.close()}catch{}const p=location.protocol==="https:"?"wss":"ws";socket=new WebSocket(`${p}://${location.host}/ws`);socket.onopen=()=>socket.send(JSON.stringify({type:"auth",token}));socket.onmessage=e=>{const x=JSON.parse(e.data);if(x.type==="friend_request"||x.type==="friend_accepted"){loadUser();return}if(x.type==="message"&&x.message){if(activeFriend&&[activeFriend.uid,me.uid].includes(x.message.from)){appendMessage(x.message);if(x.message.from===activeFriend.uid)markRead()}}if(x.type==="message_updated"&&x.message){if(activeFriend&&[activeFriend.uid,me.uid].includes(x.message.from))updateMessage(x.message)}if(x.type==="message_deleted")removeMessage(x.messageId);if(x.type==="read"&&activeFriend&&x.uid===activeFriend.uid)loadMessages();if(x.type==="presence"&&activeFriend&&x.uid===activeFriend.uid)$("typing").textContent=x.typing?`@${activeFriend.username} is typing…`:""};socket.onclose=()=>setTimeout(()=>token&&connectSocket(),1000)}
async function createStory(){const text=prompt("What do you want to put on your story?");if(!text?.trim())return;try{await api("/stories",{method:"POST",body:JSON.stringify({text:text.trim()})});loadStories()}catch(e){alert(e.message)}}
async function loadStories(){try{const stories=await api("/stories");const c=$("stories");c.innerHTML="";stories.forEach(s=>{const e=document.createElement("div");e.className="story";e.innerHTML=`<div class="avatar">${initials(s.username)}</div><div>@${esc(s.username)}</div>`;e.onclick=()=>openModal(`<h2>✨ @${esc(s.username)}'s Story</h2><p style="font-size:22px;line-height:1.4">${esc(s.text)}</p><div class="small">${new Date(s.time).toLocaleString()}</div><button class="btn" style="margin-top:12px" onclick="closeModal()">Close</button>`);c.appendChild(e)})}catch{}}
function logout(){localStorage.removeItem("felix_token");location.reload()}if(token)loadUser();else loginScreen();pollTimer=setInterval(syncFallback,2500);
</script></body></html>
